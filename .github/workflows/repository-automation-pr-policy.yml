name: Repository Automation — Pull request policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  policy:
    # Fork PR tokens are read-only. CI still runs there; this advisory comment
    # is deliberately limited to same-repository branches, whose checked-out
    # policy script may safely be the merge commit being evaluated.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish policy feedback without executing PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          script_path="tools/repository-automation/pr-policy.mjs"
          if [ ! -f "$script_path" ]; then
            echo "Skipping policy feedback: $script_path is not present in the checked-out PR merge commit."
            exit 0
          fi
          node "$script_path"
