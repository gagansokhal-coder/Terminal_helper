name: Repository Automation — Auto-merge gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-auto-merge:
    if: vars.REPOSITORY_AUTOMATION_AUTOMERGE == 'true' && github.event.review.state == 'approved' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Request GitHub squash auto-merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_AUTOMATION_AUTOMERGE: ${{ vars.REPOSITORY_AUTOMATION_AUTOMERGE }}
        run: node tools/repository-automation/merge-gate.mjs
